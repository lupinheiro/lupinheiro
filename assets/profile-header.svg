<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Luís Alonso Pinheiro — Software Engineer</title>
  <desc id="desc">Dark navy technical banner with cyan and violet gradient accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#101b35"/>
      <stop offset="1" stop-color="#1b1740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8ba4d8" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="70" r="120" fill="#6366f1" opacity=".18" filter="url(#glow)"/>
  <circle cx="940" cy="255" r="110" fill="#06b6d4" opacity=".13" filter="url(#glow)"/>
  <path d="M810 0L1200 0 1200 300 990 300Z" fill="#17264a" opacity=".34"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".7">
    <path d="M850 55h90l24 24h70"/><path d="M900 112h50l28-28h110"/>
    <path d="M820 190h110l24-24h85"/><path d="M980 230h70l24-24h80"/>
  </g>
  <g fill="#67e8f9" opacity=".8">
    <circle cx="850" cy="55" r="4"/><circle cx="1034" cy="79" r="4"/>
    <circle cx="900" cy="112" r="4"/><circle cx="1088" cy="84" r="4"/>
    <circle cx="820" cy="190" r="4"/><circle cx="1039" cy="166" r="4"/>
    <circle cx="980" cy="230" r="4"/><circle cx="1154" cy="206" r="4"/>
  </g>
  <rect x="68" y="60" width="5" height="178" rx="2.5" fill="url(#accent)"/>
  <text x="104" y="125" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="1">LUÍS ALONSO PINHEIRO</text>
  <text x="106" y="172" fill="#a5f3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">SOFTWARE ENGINEER</text>
  <text x="106" y="213" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Full-Stack &amp; Mobile Development  ·  Minho, Portugal</text>
  <text x="106" y="250" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">&lt;build /&gt;  from requirements to deployment</text>
</svg>
